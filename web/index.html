<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Bedrock Map</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/style.css?v=20260923c" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="map"></div>
    <div id="view3d" hidden></div>
    <div id="status">
      <div id="view-mode" role="group" aria-label="Map view mode">
        <button type="button" id="mode-2d" class="mode-btn active" aria-pressed="true">2D</button>
        <button type="button" id="mode-3d" class="mode-btn" aria-pressed="false">3D</button>
      </div>
      <span id="terrain-status">Terrain: …</span>
      <span id="player-status">Players: …</span>
      <button type="button" id="marker-edit">Edit markers</button>
    </div>
    <div id="hud">
      <span id="world">loading world&hellip;</span>
      <span id="cursor">cursor X -, Z -</span>
      <span id="view">-</span>
      <span id="players">players&hellip;</span>
    </div>
    <script src="/vendor/leaflet/leaflet.js"></script>
    <!-- ?v= busts browser/CDN caches that still hold pre-204 mesh clients -->
    <script type="module" src="/map.js?v=20260923c"></script>
  </body>
</html>
